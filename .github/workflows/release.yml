name: release

on:
  push:
    tags: ['v*']

jobs:
  build-and-release:
    # WPF projects need Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: application

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EmTradingSolution.slnx

      - name: Restore local tools (wix)
        run: dotnet tool restore

      - name: Accept WiX Toolset EULA
        # Free for this project (OSMF only applies to orgs with >$10k/year revenue).
        # See https://www.firegiant.com/oss-maintenance-fee/
        run: dotnet wix eula accept wix7

      - name: Publish EmTrading.App (self-contained, win-x64)
        run: >
          dotnet publish EmTrading.App/EmTrading.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o ../dist

      - name: Publish EmTrading.EngineRunner (self-contained, win-x64)
        run: >
          dotnet publish EmTrading.EngineRunner/EmTrading.EngineRunner.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o ../dist

      - name: Build installer (.msi)
        shell: pwsh
        run: |
          $productVersion = "${{ github.ref_name }}" -replace '^v', ''
          dotnet build installer/EmTrading.Installer/EmTrading.Installer.wixproj `
            -c Release `
            -p:PublishDir="$pwd/../dist" `
            -p:ProductVersion=$productVersion

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "EmTrading-$version-win-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding utf8 "$zipName.sha256"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

          $msiName = "EmTrading-$version-win-x64.msi"
          Copy-Item "application/installer/EmTrading.Installer/bin/Release/EmTrading-Setup.msi" $msiName
          $msiHash = (Get-FileHash -Algorithm SHA256 $msiName).Hash.ToLower()
          "$msiHash  $msiName" | Out-File -Encoding utf8 "$msiName.sha256"
          echo "MSI_NAME=$msiName" >> $env:GITHUB_ENV
        working-directory: .

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        working-directory: .
        run: |
          gh release create "${{ github.ref_name }}" `
            "$env:ZIP_NAME" "$env:ZIP_NAME.sha256" `
            "$env:MSI_NAME" "$env:MSI_NAME.sha256" `
            --title "${{ github.ref_name }}" `
            --generate-notes
