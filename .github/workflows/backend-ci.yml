name: backend-ci

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

jobs:
  build-and-test:
    # WPF projects need Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EmTradingSolution.slnx

      - name: Build
        run: dotnet build EmTradingSolution.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test --solution EmTradingSolution.slnx --configuration Release --no-build --coverage --coverage-output-format cobertura --results-directory TestResults

      # One report over all test projects; test code, EF migrations and generated code are left out.
      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: backend/TestResults/*.cobertura.xml
          targetdir: backend/coverage
          reporttypes: MarkdownSummaryGithub;Cobertura;HtmlInline
          assemblyfilters: +EmTrading.*;-*.Tests
          classfilters: -*.Migrations.*;-*.Designer

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: Get-Content coverage/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage
